[project]
name = "mattermost-crew"
version = "0.2.0"
description = "Workspace root for the Mattermost program: the chat daemon, the broker and the thin clients."
requires-python = ">=3.12"
dependencies = [
    "crewchat",
    "crewbroker",
    "crewchat-clients",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.uv]
# The root is a virtual project: it only gathers the members for `uv sync` and `uv run`.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
crewchat = { workspace = true }
crewbroker = { workspace = true }
crewchat-clients = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/daemon/src",
    "packages/broker/src",
    "packages/clients/src",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-p", "pytester"]
# The repo root, so tests can import the shared fakes as `tests.fakes.*`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
