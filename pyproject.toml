[project]
name = "mattermost-crew"
version = "0.4.0"
description = "Workspace root for the Mattermost program: the chat daemon, the broker and the thin clients."
requires-python = ">=3.12"
dependencies = [
    "crewchat",
    "crewbroker",
    "crewchat-clients",
    "crewkiosk",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest-timeout>=2.4",
    "shellcheck-py>=0.10",
]

[tool.uv]
# The root is a virtual project: it only gathers the members for `uv sync` and `uv run`.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
crewchat = { workspace = true }
crewbroker = { workspace = true }
crewchat-clients = { workspace = true }
crewkiosk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/daemon/src",
    "packages/broker/src",
    "packages/clients/src",
    "packages/kiosk/src",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-p", "pytester"]
# The repo root, so tests can import the shared fakes as `tests.fakes.*`.
pythonpath = ["."]
testpaths = ["tests"]
# A test that hangs fails inside the CI job's 30 minutes, with every thread's stack (#105);
# the slowest test, E2E-03's broadcast to about 30 agents, takes well under a minute.
timeout = 120
timeout_method = "thread"
# The backstop, if the timeout itself can't fire. It restarts for every test, so it has to be
# well under the job's 30 minutes to dump a hang that starts partway through the run.
faulthandler_timeout = 600

[tool.coverage.run]
branch = true
