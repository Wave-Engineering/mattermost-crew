name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint and unit tests: no root, no OS users, no systemd, no Mattermost, so it can run on the
  # org's persistent self-hosted runner (#79). The legs below can't: they change the host.
  unit:
    name: unit
    runs-on: ${{ vars.OAW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: ripgrep (#141 corpus_search)
        run: ./scripts/ci/rg-install.sh
      - name: lint and unit tests
        run: ./scripts/ci/unit.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: reports/
          if-no-files-found: error

  # IT-20 (Story 3.7): docs/runbook.md's own install and verify blocks, on a fresh VM from the
  # ephemeral pool (#83). It shares no host with the `ci` legs: the runbook must create the
  # service users itself, so nothing may set them up first.
  install:
    name: install (IT-20, runbook)
    runs-on: [self-hosted, ephemeral]
    timeout-minutes: 30
    env:
      MM_IMAGE: mattermost/mattermost-team-edition:11.11.3
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Start Mattermost
        run: ./scripts/ci/mattermost-up.sh
      - name: Runbook install and verify (IT-20)
        run: ./scripts/ci/runbook-test.sh
      - name: Mattermost logs
        if: failure()
        run: ./scripts/ci/mattermost-logs.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-install
          path: reports/
          if-no-files-found: error

  # These legs useradd as root and start Mattermost, the broker and the daemon, so they run only
  # on the ephemeral pool: a fresh VM per job, destroyed after it (#83). Never `oaw` alone:
  # the persistent barry-org-1 carries that label too.
  ci:
    name: ci (${{ matrix.leg }})
    runs-on: [self-hosted, ephemeral]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: team-11.11.3
            mm_image: mattermost/mattermost-team-edition:11.11.3
            native_token_expiry: present
            # The one leg whose installed daemon has Discord enabled, so its credential's
            # permissions are checked too (#156).
            discord: enabled
          - leg: enterprise-11.11.3
            # Unlicensed: the stand-in for Enterprise Entry (CT-01, Dev Spec 5.N-5).
            mm_image: mattermost/mattermost-enterprise-edition:11.11.3
            native_token_expiry: present
            discord: disabled
          - leg: team-11.8.5
            # The oldest supported server, at the newest 11.8 patch (CT-11). Bump the patch
            # here, and only here, when a newer 11.8 patch ships.
            mm_image: mattermost/mattermost-team-edition:11.8.5
            # Tests that need native token expiry assert it is detected as absent (R-07).
            native_token_expiry: absent
            discord: disabled
    env:
      MM_IMAGE: ${{ matrix.mm_image }}
      MM_NATIVE_TOKEN_EXPIRY: ${{ matrix.native_token_expiry }}
      CREWCHAT_CI_DISCORD: ${{ matrix.discord }}
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Two-user image
        run: ./scripts/ci/two-user-setup.sh
      - name: Start Mattermost
        run: ./scripts/ci/mattermost-up.sh
      - name: gitleaks (IT-29)
        run: ./scripts/ci/gitleaks-install.sh
      - name: ripgrep (IT-30)
        run: ./scripts/ci/rg-install.sh
      - name: make ci
        run: ./scripts/ci/ci.sh
      - name: Start broker
        run: ./scripts/ci/broker-up.sh
      - name: Start kiosk socket
        run: ./scripts/ci/kiosk-up.sh
      - name: Start daemon
        run: ./scripts/ci/daemon-up.sh
      - name: make verify-install
        run: make verify-install
      - name: Installed tests (IT-01)
        run: ./scripts/ci/installed-test.sh
      - name: Mattermost logs
        if: failure()
        run: ./scripts/ci/mattermost-logs.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.leg }}
          path: reports/
          if-no-files-found: error

  # The one check branch protection requires on `main` (#213). The jobs above are not named there:
  # an image bump renames a matrix leg, and a required check that stops reporting blocks every PR.
  # `if: always()` so it still runs, and reports, when a job it needs failed or was cancelled; it is
  # green only if all of them succeeded. Add any new job to `needs`; a test fails if one is missing.
  gate:
    name: ci-gate
    if: always()
    needs: [unit, install, ci]
    runs-on: ${{ vars.OAW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: every job passed
        run: ./scripts/ci/gate.sh unit=${{ needs.unit.result }} install=${{ needs.install.result }} ci=${{ needs.ci.result }}
