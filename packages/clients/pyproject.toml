[project]
name = "crewchat-clients"
version = "0.1.0"
description = "Thin clients of the crewchat daemon: the MCP shim and the doorbell."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewchat_clients"]
