[project]
name = "crewchat-clients"
version = "0.1.0"
description = "Thin clients of the crewchat daemon: the MCP shim and the doorbell."
requires-python = ">=3.12"
dependencies = [
    # mcp 2 removed mcp.server.fastmcp, which the shim is built on (#73).
    "mcp>=1.20,<2",
]

[project.scripts]
crewchat-mcp = "crewchat_clients.mcp_shim:main"
crewchat-doorbell = "crewchat_clients.doorbell:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewchat_clients"]
