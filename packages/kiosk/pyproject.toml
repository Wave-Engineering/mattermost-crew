[project]
name = "crewkiosk"
version = "0.2.5"
description = "The kiosk's research side: the corpus builder, and in later releases its broker and relay (#136)."
requires-python = ">=3.12"
# Stdlib only: the corpus builder runs as its own system user and needs no more (#140).
dependencies = []

[project.scripts]
crewkiosk-corpus = "crewkiosk.corpus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewkiosk"]
