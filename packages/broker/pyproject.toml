[project]
name = "crewbroker"
version = "0.2.4"
description = "The per-crew broker: creates bot accounts and mints, rotates and revokes their tokens."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",  # below the next major, for installs without uv.lock (#73)
    # The broker account's websocket, for the partner's switch DMs (Story 3.1).
    "websockets>=15,<18",  # the daemon's bound (#73)
]

[project.scripts]
crewbroker = "crewbroker.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewbroker"]
