# /etc/tmpfiles.d/crewchat-pool.conf: the kiosk's corpus pool manifests (#139, D-112), only on
# a host with a `kiosk_research = true` server. The daemon writes one 0640 manifest per research
# server; crewkiosk-corpus (#140), in the crewcorpus group, reads them. Needs the crewcorpus group.
d /var/lib/crewchat-pool 0750 crewchat crewcorpus -
