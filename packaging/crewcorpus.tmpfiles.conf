# /etc/tmpfiles.d/crewcorpus.conf: the kiosk's corpus (#140; D-111), only on a host with a
# `kiosk_research = true` server. Needs the crewcorpus user and group and the crewkiosk-broker group.
# crewkiosk-corpus writes it; crewkiosk-broker (#141) reads it; the kiosk never does.
# 2751: the daemon can pass through to status/, but can't list the root. Setgid, so each
# <server> directory the builder makes gets the crewkiosk-broker group, which the builder,
# not being in it, could not set itself. Each is 0750 (the unit's UMask=0027).
d /var/lib/crewcorpus 2751 crewcorpus crewkiosk-broker -
# Each server's build status, for the daemon's `health`: repo names and states, never a secret.
d /var/lib/crewcorpus/status 0755 crewcorpus crewcorpus -
